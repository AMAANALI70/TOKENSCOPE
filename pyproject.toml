[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tokenscope"
version = "0.1.0"
description = "Find where your LLM agent's tokens go. Profile, optimize, verify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "agents", "tokens", "cost", "optimization", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
# Accurate OpenAI-family token counts. Without it, a chars/4 heuristic is used.
tiktoken = ["tiktoken>=0.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
tokenscope = "tokenscope.cli:app"

[project.urls]
Homepage = "https://github.com/<you>/tokenscope"
Issues = "https://github.com/<you>/tokenscope/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tokenscope"]

[[tool.mypy.overrides]]
module = "tiktoken.*"
ignore_missing_imports = true
